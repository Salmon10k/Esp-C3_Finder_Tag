; ESP32-C3 Super Mini BLE finder tag
;
;   pio run                  build both envs
;   pio run -e debug -t upload && pio device monitor     bench / USB serial
;   pio run -e battery -t upload                         field build (deep sleep)
;
; If the USB port disappears after flashing the battery env (no USB serial in
; that build), hold BOOT, tap RESET, release BOOT to re-enter download mode.

[platformio]
default_envs = debug

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; Bench: continuous advertising + serial logs over native USB (CDC).
[env:debug]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D DEBUG_SERIAL=1
    -D MODE_BURST=0

; Field: short advertising bursts + deep sleep, no serial (saves power).
[env:battery]
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D DEBUG_SERIAL=0
    -D MODE_BURST=1
